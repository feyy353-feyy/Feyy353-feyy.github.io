                if (user.status !== 'approved') throw new Error("Akun dinonaktifkan.");
                
                let userMenus = user.role === 'ADMIN' ? ['Home', 'Lomba', 'Penilaian', 'Juara', 'Pengguna', 'Pengaturan'] : mockPermissions.filter(p => p.role === user.role && p.enabled).map(p => p.menu);
                return { token: `token_${user.username}`, username: user.username, name: user.name, role: user.role, status: user.status, menus: userMenus };
            }
            if (action === 'register') {
                if (mockUsers.find(u => u.username === data.username)) throw new Error("Username sudah ada.");

            }
            if (action === 'getUsers') return mockUsers;

                const userIndex = mockUsers.findIndex(u => u.username === data.username);

                return { message: "Status berhasil diubah." };
            }

                mockChats[data.lombaId].push(newMsg);
                return newMsg;

                mockScores[`${data.username}-${data.competition}`] = data.score;

        const PullToRefresh = ({ onRefresh, children }) => {
            const [isPulling, setIsPulling] = useState(false);
            const [pullDistance, setPullDistance] = useState(0);
            const scrollRef = useRef(null);
            
            const handleTouchStart = (e) => {
                if (scrollRef.current && scrollRef.current.scrollTop === 0) scrollRef.current.setAttribute('data-start-y', e.touches[0].clientY);
            };
            const handleTouchMove = (e) => {
                const startY = scrollRef.current?.getAttribute('data-start-y');
                if (startY) {
                    const dist = e.touches[0].clientY - parseFloat(startY);
                    if (dist > 0 && scrollRef.current.scrollTop === 0) { setIsPulling(true); setPullDistance(Math.min(dist * 0.5, 80)); }
                }
            };
            const handleTouchEnd = async () => {
                if (pullDistance > 50) { setPullDistance(80); await onRefresh(); }
                setIsPulling(false); setPullDistance(0);
                if (scrollRef.current) scrollRef.current.removeAttribute('data-start-y');
            };

            return (
                <div className="h-full flex flex-col relative overflow-hidden" onTouchStart={handleTouchStart} onTouchMove={handleTouchMove} onTouchEnd={handleTouchEnd}>
                    <div style={{ height: pullDistance, opacity: pullDistance / 80 }} className="flex justify-center items-center overflow-hidden transition-all duration-300">
                        {isPulling && pullDistance < 50 ? <i className="fa-solid fa-arrow-down text-brand-300"></i> : <div className="loader-ring !w-6 !h-6"></div>}

                            return (

                                    {!isMe && <span className="text-[11px] font-bold text-gray-400 ml-2 mb-1">{msg.isAdmin && <i className="fa-solid fa-shield-halved text-brand-400 mr-1"></i>}{msg.sender}</span>}
                                    <div className={`px-4 py-3 max-w-[85%] text-[15px] ${isMe ? 'chat-bubble-right text-white shadow-lg' : 'chat-bubble-left text-gray-100 shadow-md backdrop-blur-md'}`}>
                                        {msg.image && <img src={msg.image} className="max-w-full rounded-xl mb-2 border border-white/20" />}
                                        {msg.video && <video src={msg.video} className="max-w-full rounded-xl mb-2 border border-white/20" controls />}
                                        {msg.text}
                                        <div className={`text-[10px] mt-1.5 text-right font-medium ${isMe ? 'text-white/70' : 'text-gray-400'}`}>{msg.time} <i className="fa-solid fa-check-double text-blue-200 ml-1"></i></div>
                                    </div>
                                </div>
                            );
                        })}
                        <div ref={scrollRef} className="h-4"></div>
                    </div>
                    <div className="absolute bottom-0 left-0 right-0 p-4 bg-[#0f172a]/90 backdrop-blur-xl border-t border-white/10 z-20 pb-6">
                        <form onSubmit={e => handleSend(e)} className="flex gap-3 max-w-4xl mx-auto items-center">
                            <input type="file" accept="image/*,video/*" ref={fileInputRef} onChange={handleMediaSelect} className="hidden" />
                            <button type="button" onClick={() => fileInputRef.current.click()} className="w-12 h-12 rounded-full bg-white/10 text-brand-300 flex items-center justify-center shadow-inner shrink-0"><i className="fa-solid fa-paperclip text-lg"></i></button>
                            <input type="text" value={text} onChange={e => setText(e.target.value)} placeholder="Ketik pesan..." className="flex-1 bg-white/10 border border-white/20 rounded-full px-5 py-3.5 text-white focus:outline-none focus:border-brand-400" />
                            <button type="submit" disabled={!text.trim()} className="w-12 h-12 shrink-0 rounded-full bg-gradient-to-r from-brand-500 to-brand-600 text-white flex items-center justify-center hover:scale-105 disabled:opacity-50"><i className="fa-solid fa-paper-plane text-lg ml-[-2px]"></i></button>
                        </form>
                    </div>
                </div>
            );
        };

        const LombaView = ({ setOverlayView }) => (
            <div className="pb-36 pt-6 px-4 max-w-4xl mx-auto h-full">
                <h2 className="text-3xl font-black text-white mb-6 text-center drop-shadow-md">Panduan & Diskusi</h2>
                <div className="grid md:grid-cols-2 gap-6">
                    {Object.entries(juknisData).map(([id, data]) => (
                        <div key={id} className="glass-card rounded-[2.5rem] overflow-hidden group flex flex-col border border-white/10">
                            <div className={`h-3 bg-gradient-to-r ${data.color} w-full`}></div>
                            <div className="p-8 flex-1 flex flex-col justify-center items-center text-center">
                                <div className={`w-24 h-24 rounded-[2rem] flex items-center justify-center bg-gradient-to-br ${data.color} shadow-lg mb-6 group-hover:scale-110 group-hover:rotate-3 transition-transform duration-500`}><i className={`fa-solid ${data.icon} text-4xl text-white`}></i></div>
                                <h3 className="text-2xl font-bold text-white mb-3">{data.title}</h3>
                                <div className="flex w-full gap-3 mt-auto">
                                    <button onClick={() => setOverlayView({type:'slide', id})} className="flex-1 glass-strong py-3.5 rounded-2xl text-white font-bold hover:bg-white/20 transition"><i className="fa-solid fa-play mr-2 text-brand-300"></i> Juknis PPT</button>
                                    <button onClick={() => setOverlayView({type:'chat', id})} className="flex-1 bg-brand-600/40 border border-brand-500/50 py-3.5 rounded-2xl text-brand-50 font-bold hover:bg-brand-500 transition"><i className="fa-regular fa-comments mr-2"></i> Grup Chat</button>
                                </div>
                            </div>
                        </div>
                    ))}
                </div>
            </div>
        );

        const PenilaianView = ({ user, showToast, setOverlayView }) => {
            const [participants, setParticipants] = useState([]);
            const [lombaId, setLombaId] = useState('mqk');
            const [scores, setScores] = useState({});
            const [loading, setLoading] = useState(true);

            useEffect(() => { fetchApi('getUsers').then(res => { setParticipants(res.filter(u => u.role === 'PESERTA' && u.status === 'approved' && (u.competition === lombaId || !u.competition))); setLoading(false); }); }, [lombaId]);

            return (
                <div className="pb-36 pt-6 px-4 max-w-4xl mx-auto h-full flex flex-col">
                    <h2 className="text-2xl font-bold text-white mb-6 flex items-center gap-3"><i className="fa-solid fa-star-half-stroke text-brand-400"></i> Penilaian Dewan Juri</h2>
                    <div className="flex flex-nowrap gap-3 mb-6 overflow-x-auto hide-scrollbar pb-2 w-full shrink-0">
                        {Object.entries(juknisData).map(([id, data]) => (
                            <button key={id} onClick={() => setLombaId(id)} className={`shrink-0 px-6 py-3 rounded-2xl font-bold transition-all ${lombaId === id ? `bg-gradient-to-r ${data.color} text-white shadow-lg` : 'glass-strong text-gray-300 hover:text-white border border-white/10'}`}>
                                <i className={`fa-solid ${data.icon} mr-2`}></i> {data.title.split('(')[0]}
                            </button>
                        ))}
                    </div>
                    {loading ? <div className="text-center py-10"><div className="loader-ring"></div></div> : (
                        <div className="space-y-4 pb-10">
                            {participants.length === 0 ? <div className="text-center text-gray-400 py-8 glass-strong rounded-3xl">Belum ada peserta di kategori ini.</div> : participants.map((p, i) => (
                                <div key={i} className="glass-card rounded-[2rem] p-5 border border-white/10 flex items-center justify-between">
                                    <div className="flex-1 overflow-hidden mr-4">
                                        <h3 className="font-bold text-white text-lg truncate">{p.name}</h3>
                                        <p className="text-xs text-brand-300 font-medium truncate mb-1">@{p.username} {p.instansi ? `• ${p.instansi}` : ''}</p>
                                        {scores[`${p.username}-${lombaId}`] && <span className="text-[10px] bg-green-500/20 text-green-400 px-2 py-0.5 rounded border border-green-500/30">Sudah Dinilai</span>}
                                    </div>
                                    <div className="flex items-center gap-3 shrink-0">
                                        {scores[`${p.username}-${lombaId}`] && <span className="bg-green-500/20 text-green-400 px-3 py-1.5 rounded-xl text-sm font-bold border border-green-500/30">{scores[`${p.username}-${lombaId}`]} Poin</span>}
                                        <button onClick={() => setOverlayView({type: 'penilaian', participant: p, lombaId, onSuccess: (score) => setScores(prev => ({...prev, [`${p.username}-${lombaId}`]: score}))})} className={`w-12 h-12 rounded-2xl flex items-center justify-center text-white bg-gradient-to-br ${juknisData[lombaId].color} hover:scale-105 transition-all shadow-lg`}><i className="fa-solid fa-pen-to-square"></i></button>
                                    </div>
                                </div>
                            ))}
                        </div>
                    )}
                </div>
            );
        };

        const JuaraView = () => {
            const [winners, setWinners] = useState(null);
            const [loading, setLoading] = useState(true);
            useEffect(() => { fetchApi('getWinners').then(res => { setWinners(res); setLoading(false); }); }, []);

            const getRankStyle = (rank) => {
                if(rank === 1) return 'bg-yellow-400 text-yellow-900 shadow-[0_0_15px_rgba(250,204,21,0.5)]';
                if(rank === 2) return 'bg-gray-300 text-gray-800 shadow-[0_0_15px_rgba(209,213,219,0.5)]';
                return 'bg-orange-400 text-orange-900 shadow-[0_0_15px_rgba(251,146,60,0.5)]';
            };

            return (
                <div className="pb-36 pt-6 px-4 max-w-4xl mx-auto h-full">
                    <h2 className="text-2xl font-bold text-white mb-6 flex items-center gap-3"><i className="fa-solid fa-medal text-brand-400"></i> Rekap Juara Lomba</h2>
                    {loading ? <div className="text-center py-10"><div className="loader-ring"></div></div> : (
                        <div className="space-y-8 pb-10">
                            {Object.entries(juknisData).map(([id, data]) => {
                                const lombaWinners = winners?.[id] || [];
                                return (
                                    <div key={id} className="glass-strong rounded-[2.5rem] p-6 border border-white/20 overflow-hidden relative">
                                        <div className={`absolute -right-10 -top-10 opacity-10 text-9xl`}><i className={`fa-solid ${data.icon}`}></i></div>
                                        <div className="flex items-center gap-3 mb-6 border-b border-white/10 pb-4 relative z-10">
                                            <div className={`w-12 h-12 rounded-2xl bg-gradient-to-br ${data.color} flex items-center justify-center text-white shadow-lg`}><i className={`fa-solid ${data.icon} text-xl`}></i></div>
                                            <h3 className="text-xl font-bold text-white">{data.title.split('(')[0]}</h3>
                                        </div>
                                        {lombaWinners.length === 0 ? <p className="text-gray-400 text-sm italic text-center py-4 relative z-10">Belum ada rekap data juara.</p> : (
                                            <div className="space-y-3 relative z-10">
                                                {lombaWinners.map((w, i) => (
                                                    <div key={i} className="flex items-center gap-4 bg-white/5 p-4 rounded-2xl border border-white/10">
                                                        <div className={`w-10 h-10 rounded-full flex items-center justify-center font-black text-lg shadow-inner ${getRankStyle(w.rank)}`}>{w.rank}</div>
                                                        <div className="flex-1"><p className="font-bold text-white">{w.name}</p><p className="text-xs text-brand-300">{w.instansi}</p></div>
                                                        <div className="text-right"><p className="text-2xl font-black text-white">{w.score}</p><p className="text-[9px] uppercase tracking-widest text-gray-400">Poin</p></div>
                                                    </div>
                                                ))}
                                            </div>
                                        )}
                                    </div>
                                );
                            })}
                        </div>
                    )}
                </div>
            );
        };

        const AdminSettingsView = ({ showToast }) => {
            const { settings, setSettings } = useContext(SettingsContext);
            const [form, setForm] = useState(settings);
            const handleSave = (e) => { e.preventDefault(); setSettings(form); localStorage.setItem('sf_settings', JSON.stringify(form)); showToast('Pengaturan UI disimpan.', 'success'); };
            const handleFileRead = (e, field) => { const file = e.target.files[0]; if(file) { const reader = new FileReader(); reader.onloadend = () => setForm({...form, [field]: reader.result}); reader.readAsDataURL(file); } };

            return (
                <div className="pb-36 pt-6 px-4 max-w-2xl mx-auto h-full">
                    <h2 className="text-2xl font-bold text-white mb-6 flex items-center gap-3"><i className="fa-solid fa-sliders text-brand-400"></i> Pengaturan Tampilan</h2>
                    <form onSubmit={handleSave} className="glass-strong rounded-[2.5rem] p-6 space-y-6 border border-white/20">
                        <div><label className="block text-sm font-bold text-gray-300 mb-2">Teks Sambutan</label><input type="text" value={form.loginTitle} onChange={e=>setForm({...form, loginTitle: e.target.value})} className="w-full px-5 py-4 glass-input rounded-2xl text-lg font-bold" /></div>
                        <div>
                            <label className="block text-sm font-bold text-gray-300 mb-2">Logo Aplikasi (Upload Galeri / Teks)</label>
                            <div className="flex gap-3"><input type="text" value={form.logoUrl} onChange={e=>setForm({...form, logoUrl: e.target.value})} className="flex-1 px-5 py-4 glass-input rounded-2xl text-sm" placeholder="URL atau Base64" />
                            <label className="bg-white/10 hover:bg-white/20 text-white px-5 py-4 rounded-2xl cursor-pointer flex items-center justify-center border border-white/20"><i className="fa-solid fa-upload text-lg"></i><input type="file" accept="image/*" className="hidden" onChange={e => handleFileRead(e, 'logoUrl')} /></label></div>
                        </div>
                        <div>
                            <label className="block text-sm font-bold text-gray-300 mb-2">Background Utama (Upload Galeri / Teks)</label>
                            <div className="flex gap-3"><input type="text" value={form.bgUrl} onChange={e=>setForm({...form, bgUrl: e.target.value})} className="flex-1 px-5 py-4 glass-input rounded-2xl text-sm" placeholder="URL atau Base64" />
                            <label className="bg-white/10 hover:bg-white/20 text-white px-5 py-4 rounded-2xl cursor-pointer flex items-center justify-center border border-white/20"><i className="fa-solid fa-image text-lg"></i><input type="file" accept="image/*" className="hidden" onChange={e => handleFileRead(e, 'bgUrl')} /></label></div>
                        </div>
                        <button type="submit" className="w-full bg-gradient-to-r from-brand-500 to-brand-600 text-white px-8 py-4 rounded-2xl font-black text-lg transition shadow-lg hover:scale-105">Simpan Perubahan Visual</button>
                    </form>
                </div>
            );
        };

        const PenggunaView = ({ showToast }) => {
            const [users, setUsers] = useState([]);
            useEffect(() => { fetchApi('getUsers').then(res => setUsers(res)); }, []);
            const updateStatus = async (username, status) => { await fetchApi('adminSetUserStatus', { username, status }); setUsers(users.map(u => u.username === username ? {...u, status} : u)); showToast(`Status diubah menjadi ${status}`); };
            
            return (
                <div className="pb-36 pt-6 px-4 max-w-4xl mx-auto h-full">
                    <h2 className="text-2xl font-bold text-white mb-6 flex items-center gap-3"><i className="fa-solid fa-users text-brand-400"></i> Kelola Pengguna</h2>
                    <div className="glass-strong rounded-3xl overflow-hidden border border-white/20">
                        <table className="w-full text-left text-sm text-gray-200">
                            <thead className="bg-black/40 text-brand-300"><tr><th className="p-4 font-bold">Pengguna</th><th className="p-4 font-bold">Status</th><th className="p-4 font-bold text-right">Aksi</th></tr></thead>
                            <tbody className="divide-y divide-white/10">
                                {users.map((u, i) => (
                                    <tr key={i} className="hover:bg-white/5">
                                        <td className="p-4"><div className="font-bold text-white text-base">{u.name}</div><div className="text-xs text-brand-300">@{u.username} - {u.role}</div></td>
                                        <td className="p-4"><span className={`px-3 py-1.5 rounded-lg text-xs font-bold ${u.status==='approved'?'bg-green-500/20 text-green-400':u.status==='pending'?'bg-yellow-500/20 text-yellow-400':'bg-red-500/20 text-red-400'}`}>{u.status.toUpperCase()}</span></td>
                                        <td className="p-4 text-right space-x-2 whitespace-nowrap">
                                            {u.status !== 'approved' && <button onClick={()=>updateStatus(u.username, 'approved')} className="bg-green-500/20 text-green-400 px-3 py-1.5 rounded-lg text-xs font-bold border border-green-500/50">Approve</button>}
                                            {u.status !== 'rejected' && <button onClick={()=>updateStatus(u.username, 'rejected')} className="bg-red-500/20 text-red-400 px-3 py-1.5 rounded-lg text-xs font-bold border border-red-500/50">Tolak</button>}
                                        </td>
                                    </tr>
                                ))}
                            </tbody>
                        </table>
                    </div>
                </div>
            );
        };

        // ==========================================
        // 5. KERNEL UTAMA (AUTH & DASHBOARD)
        // ==========================================
        const Dashboard = ({ user, token, onLogout, showToast }) => {
            const initialMenu = user.menus.includes('Home') ? 'Home' : (user.menus[0] || '');
            const [activeMenu, setActiveMenu] = useState(initialMenu);
            const [overlayView, setOverlayView] = useState(null); 
            const menuIcons = { "Home": "fa-house", "Lomba": "fa-trophy", "Pengguna": "fa-users", "Pengaturan": "fa-sliders", "Penilaian": "fa-star-half-stroke", "Juara": "fa-medal" };
            const [refreshKey, setRefreshKey] = useState(0);

            const handleRefresh = async () => { await new Promise(r => setTimeout(r, 800)); setRefreshKey(prev => prev + 1); };

            const renderView = () => {
                switch(activeMenu) {
                    case 'Home': return <HomeView key={`home-${refreshKey}`} user={user} />;
                    case 'Lomba': return <LombaView key={`lomba-${refreshKey}`} setOverlayView={setOverlayView} />;
                    case 'Pengaturan': return <AdminSettingsView key={`set-${refreshKey}`} showToast={showToast} />;
                    case 'Pengguna': return <PenggunaView key={`user-${refreshKey}`} showToast={showToast} />;
                    case 'Penilaian': return <PenilaianView key={`nilai-${refreshKey}`} user={user} showToast={showToast} setOverlayView={setOverlayView} />;
                    case 'Juara': return <JuaraView key={`juara-${refreshKey}`} />;
                    default: return <div className="text-center p-10 text-white"><i className="fa-solid fa-code text-4xl mb-4 text-brand-400"></i><h2 className="text-2xl font-bold">Segera Hadir</h2></div>;
                }
            };

            return (
                <div className="flex flex-col h-screen relative bg-black/20 backdrop-blur-sm">
                    <header className="h-[72px] glass-strong flex items-center justify-between px-6 z-20 shrink-0 border-b border-white/10">
                        <div className="flex items-center gap-3"><AppLogo className="text-2xl text-brand-400" /><h1 className="text-lg font-black text-white tracking-wide hidden sm:block">SantriFest<span className="text-brand-400">26</span></h1></div>
                        <div className="flex items-center gap-4">
                            <div className="hidden sm:block text-right mr-2"><p className="text-sm font-bold text-white">{user.name}</p><p className="text-xs text-brand-300 font-bold">{user.role}</p></div>
                            <button onClick={onLogout} className="w-10 h-10 rounded-full bg-red-500/20 border border-red-500/30 text-red-300 flex items-center justify-center"><i className="fa-solid fa-power-off"></i></button>
                        </div>
                    </header>
                    
                    <main className="flex-1 overflow-hidden flex flex-col relative">
                        <PullToRefresh onRefresh={handleRefresh}>
                            {/* Wrapper Animasi Transisi Modern Page-Enter */}
                            <div key={activeMenu} className="animate-page-enter h-full">
                                {renderView()}
                            </div>
                        </PullToRefresh>
                    </main>
                    
                    <nav className="fixed bottom-6 left-1/2 transform -translate-x-1/2 z-50 w-11/12 max-w-md">
                        <div className="glass-strong rounded-3xl px-2 py-2.5 flex justify-around items-center shadow-[0_15px_40px_rgba(0,0,0,0.7)] border border-white/20 overflow-x-auto hide-scrollbar">
                            {user.menus.map((menu) => {
                                const isActive = activeMenu === menu;
                                return (
                                    <button key={menu} onClick={() => setActiveMenu(menu)} className="relative flex flex-col items-center justify-center w-16 h-14 rounded-2xl transition-all z-10 group shrink-0">
                                        <i className={`fa-solid ${menuIcons[menu] || 'fa-circle'} text-[22px] transition-all duration-300 ${isActive ? 'text-brand-400 -translate-y-1 drop-shadow-md' : 'text-gray-400 group-hover:text-gray-200'}`}></i>
                                        <span className={`text-[10px] font-bold transition-all duration-300 absolute bottom-1 ${isActive ? 'opacity-100 text-white' : 'opacity-0 translate-y-2'}`}>{menu === 'Pengaturan' ? 'Setelan' : menu}</span>
                                        {isActive && <div className="absolute inset-0 bg-white/10 rounded-2xl shadow-inner border border-white/10 scale-90"></div>}
                                    </button>
                                );
                            })}
                        </div>
                    </nav>

                    {/* ROOT LEVEL OVERLAYS (Z-INDEX 999999 to cover bottom nav) */}
                    {overlayView?.type === 'slide' && <LombaSlides lombaId={overlayView.id} onClose={() => setOverlayView(null)} />}
                    {overlayView?.type === 'chat' && <LombaChat lombaId={overlayView.id} user={user} onClose={() => setOverlayView(null)} />}
                    {overlayView?.type === 'penilaian' && <PenilaianModal participant={overlayView.participant} lombaId={overlayView.lombaId} onClose={() => setOverlayView(null)} user={user} showToast={showToast} onSuccess={overlayView.onSuccess} />}
                </div>
            );
        };

        const AuthModal = ({ isOpen, onClose, onLogin, showToast }) => {
            const [isLogin, setIsLogin] = useState(true);
            const [formData, setFormData] = useState({ username: '', password: '', name: '' });

            if (!isOpen) return null;
            const handleSubmit = async (e) => { e.preventDefault(); try { const res = await fetchApi(isLogin ? 'login' : 'register', formData); if (isLogin) onLogin(res); else { showToast(res.message, 'success'); setIsLogin(true); } } catch (err) { showToast(err.message, 'error'); } };

            return (
                <div className="fixed inset-0 z-[999999] flex items-center justify-center p-4">
                    <div className="absolute inset-0 bg-black/80 backdrop-blur-md" onClick={onClose}></div>
                    <div className="w-full max-w-md glass-strong rounded-[2.5rem] p-8 relative z-10 animate-zoom-in border border-white/20 shadow-2xl">
                        <button onClick={onClose} className="absolute top-5 right-5 text-gray-400 hover:text-white w-10 h-10 rounded-full flex items-center justify-center"><i className="fa-solid fa-times"></i></button>
                        <div className="text-center mb-8"><AppLogo className="text-5xl text-brand-300 mb-4 inline-block drop-shadow-lg" /><h2 className="text-3xl font-black text-white tracking-tight">{isLogin ? 'Login Portal' : 'Daftar Baru'}</h2></div>
                        <form onSubmit={handleSubmit} className="space-y-4">
                            {!isLogin && (<div className="relative"><i className="fa-regular fa-id-card absolute left-5 top-4 text-brand-300 text-lg"></i><input type="text" required className="w-full pl-14 pr-4 py-4 glass-input rounded-2xl font-medium" value={formData.name} onChange={e => setFormData({...formData, name: e.target.value})} placeholder="Nama / Instansi" /></div>)}
                            <div className="relative"><i className="fa-regular fa-user absolute left-5 top-4 text-brand-300 text-lg"></i><input type="text" required minLength={3} className="w-full pl-14 pr-4 py-4 glass-input rounded-2xl font-medium" value={formData.username} onChange={e => setFormData({...formData, username: e.target.value})} placeholder="Username" /></div>
                            <div className="relative"><i className="fa-solid fa-lock absolute left-5 top-4 text-brand-300 text-lg"></i><input type="password" required minLength={3} className="w-full pl-14 pr-4 py-4 glass-input rounded-2xl font-medium" value={formData.password} onChange={e => setFormData({...formData, password: e.target.value})} placeholder="Password" /></div>
                            <button type="submit" className="w-full bg-gradient-to-r from-brand-500 to-brand-600 text-white font-black text-lg py-4 rounded-2xl transition shadow-lg mt-6 hover:scale-105">{isLogin ? 'Masuk' : 'Daftar Sekarang'}</button>
                        </form>
                        <div className="mt-6 text-center text-sm font-medium">
                            <span className="text-gray-400">{isLogin ? 'Belum punya akun?' : 'Sudah mendaftar?'}</span>
                            <button onClick={() => setIsLogin(!isLogin)} className="ml-2 text-brand-300 font-bold hover:text-white underline decoration-brand-300/50 underline-offset-4">{isLogin ? 'Buat Akun' : 'Login disini'}</button>
                            <p className="text-[10px] text-gray-500 mt-4">(Gunakan admin / admin123 jika API belum aktif)</p>
                        </div>
                    </div>
                </div>
            );
        };

        const App = () => {
            const [toast, setToast] = useState(null);
            const [showAuthModal, setShowAuthModal] = useState(false);
            const [settings, setSettings] = useState(() => { const saved = localStorage.getItem('sf_settings'); return saved ? JSON.parse(saved) : defaultSettings; });
            const [authState, setAuthState] = useState(() => { const saved = localStorage.getItem('sf_auth'); return saved ? JSON.parse(saved) : { token: null, user: null }; });

            const showToast = (message, type = 'success') => setToast({ message, type });
            const handleLogin = (data) => { const newState = { token: data.token, user: data }; setAuthState(newState); localStorage.setItem('sf_auth', JSON.stringify(newState)); setShowAuthModal(false); };
            const handleLogout = () => { setAuthState({ token: null, user: null }); localStorage.removeItem('sf_auth'); };

            return (
                <SettingsContext.Provider value={{ settings, setSettings }}>
                    <div className="bg-dynamic" style={{ backgroundImage: `url(${settings.bgUrl})` }}></div>
                    <div className="bg-overlay"></div>
                    <div className="h-full relative">
                        {authState.token ? <Dashboard user={authState.user} token={authState.token} onLogout={handleLogout} showToast={showToast} /> : <PublicFeed onOpenLogin={() => setShowAuthModal(true)} />}
                        <AuthModal isOpen={showAuthModal} onClose={() => setShowAuthModal(false)} onLogin={handleLogin} showToast={showToast} />
                        {toast && <Toast message={toast.message} type={toast.type} onClose={() => setToast(null)} />}
                    </div>
                </SettingsContext.Provider>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
